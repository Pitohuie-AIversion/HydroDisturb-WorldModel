[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrodisturb-wm"
version = "0.1.0"
description = "HydroDisturb-WorldModel: 3D Spatiotemporal Flow-Field World Model for HydroDisturb-Bench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.5.1,<2.9.0"]
data = ["h5py>=3.14", "pyyaml>=6.0"]
dev = ["pytest>=8"]
all = ["torch>=2.5.1,<2.9.0", "h5py>=3.14", "pyyaml>=6.0", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
